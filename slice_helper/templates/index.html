<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TS 连续拆条</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>TS 连续拆条</h1>
      <span class="version">v{{ version }}</span>
    </div>
    <div class="topbar-actions">
      <span id="healthBadge" class="health neutral">检查中</span>
      <button id="refreshButton" class="button secondary" type="button">刷新</button>
      <button id="openCreateButton" class="button primary" type="button">新建作业</button>
    </div>
  </header>

  <main>
    <section class="band jobs-band">
      <div class="section-heading">
        <div>
          <h2>作业列表</h2>
          <span id="jobCount" class="count">0</span>
        </div>
        <label class="filter-label">
          状态
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="queued">排队中</option>
            <option value="probing">探测中</option>
            <option value="running">处理中</option>
            <option value="pause_requested">等待暂停</option>
            <option value="paused">已暂停</option>
            <option value="completed">已完成</option>
            <option value="failed">失败</option>
            <option value="stop_requested">等待停止</option>
            <option value="stopped">已停止</option>
          </select>
        </label>
      </div>
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>源文件</th>
              <th>状态</th>
              <th>进度</th>
              <th>窗口</th>
              <th>结果片段</th>
              <th>创建时间</th>
              <th class="actions-column">操作</th>
            </tr>
          </thead>
          <tbody id="jobsBody"></tbody>
        </table>
      </div>
      <div id="emptyJobs" class="empty-state" hidden>暂无作业</div>
    </section>

    <section id="detailBand" class="band detail-band" hidden>
      <div class="detail-header">
        <div>
          <p id="detailId" class="mono detail-id"></p>
          <h2 id="detailTitle">作业详情</h2>
          <p id="detailPath" class="path-text"></p>
        </div>
        <div id="detailActions" class="detail-actions"></div>
      </div>

      <div class="summary-grid">
        <div><span>状态</span><strong id="summaryStatus"></strong></div>
        <div><span>源时长</span><strong id="summaryDuration"></strong></div>
        <div><span>当前窗口</span><strong id="summaryWindow"></strong></div>
        <div><span>切割方式</span><strong id="summaryCutMode"></strong></div>
      </div>
      <div class="progress-track"><div id="detailProgress" class="progress-value"></div></div>
      <p id="detailError" class="error-banner" hidden></p>
      <div id="detailWarnings" class="warning-list"></div>

      <div class="subsection-heading">
        <h3>窗口时间线</h3>
      </div>
      <div class="table-scroll">
        <table class="data-table compact">
          <thead><tr><th>#</th><th>源起点</th><th>整点终点</th><th>状态</th><th>交接起点</th><th>错误</th></tr></thead>
          <tbody id="windowsBody"></tbody>
        </table>
      </div>

      <div class="subsection-heading segments-heading">
        <h3>拆条结果</h3>
        <label><input id="acceptedOnly" type="checkbox" checked> 仅最终采用</label>
      </div>
      <div class="table-scroll">
        <table class="data-table compact">
          <thead><tr><th>时间</th><th>标题</th><th>主题</th><th>关键词</th><th>来源窗口</th><th>状态</th><th>视频</th></tr></thead>
          <tbody id="segmentsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="createDialog">
    <form id="createForm" method="dialog">
      <div class="dialog-header">
        <h2>新建连续拆条作业</h2>
        <button id="closeCreateButton" class="icon-button" type="button" aria-label="关闭">×</button>
      </div>
      <div class="form-grid">
        <label class="full">TS 绝对路径<input name="sourcePath" required placeholder="D:\video\day.ts"></label>
        <label>模板<select name="templateId"><option value="general">综合新闻</option><option value="sports">体育</option><option value="live">直播</option></select></label>
        <label>语言<select name="language"><option value="zh">中文</option><option value="en">英文</option></select></label>
        <label>切割方式<select name="cutMode"><option value="copy">流复制</option><option value="transcode">重编码</option></select></label>
        <label>频道<input name="channelName" placeholder="可选"></label>
        <label class="full">节目开始时间<input name="programStartTime" type="datetime-local"></label>
      </div>
      <p id="createError" class="form-error" hidden></p>
      <div class="dialog-actions">
        <button id="cancelCreateButton" class="button secondary" type="button">取消</button>
        <button id="submitCreateButton" class="button primary" type="submit">创建作业</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</body>
</html>

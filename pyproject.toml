[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slice-helper"
version = "0.4.0"
description = "Continuous TS window orchestrator for iSlice"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "rapidocr-onnxruntime>=1.4,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[tool.setuptools.packages.find]
include = ["slice_helper*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

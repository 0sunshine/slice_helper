upstream islice_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

server {
    listen 8000 default_server;
    server_name _;
    client_max_body_size 0;

    location ^~ /download/ {
        proxy_pass http://islice_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @archive_redirect;
    }

    location @archive_redirect {
        return 307 http://192.168.6.200:18080/sources/islice-128$request_uri;
    }

    location / {
        proxy_pass http://islice_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 21600s;
        proxy_send_timeout 21600s;
    }
}

worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;

events {
    worker_connections 2048;
}

http {
    include mime.types;
    default_type application/octet-stream;

    log_format archive '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log logs/access.log archive;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 18080;
        server_name _;

        location = /health/archive {
            alias /mpeg/mpeg2/codex/archive/health.txt;
            default_type text/plain;
        }

        location ^~ /download/ {
            alias /mpeg/mpeg2/codex/archive/tasks/;
            autoindex off;
            limit_except GET { deny all; }
            add_header Accept-Ranges bytes always;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location / {
            root /mpeg/mpeg2/codex/archive/empty;
        }
    }
}
